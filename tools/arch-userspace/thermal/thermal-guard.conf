# /etc/tb710fu/thermal-guard.conf  (v5 battery-only)
# Temperatures in millidegrees Celsius, frequencies in kHz.

# --- battery tiers (0.5 C exit hysteresis on every boundary) ---
BATT_T1=38000           # yellow: X4 2.6 / A720 2.4 / A520 1.8 GHz
BATT_T2=39000           # red:    X4 2.3 / A720 2.1 / A520 1.5 GHz
BATT_T3=40000           # purple: X4 2.0 / A720 1.8 / A520 1.3 GHz
BATT_EMERG=40500        # emergency: per-cluster floor, keeps battery < 41 C
BATT_CRITICAL=40900     # charging hard stop: constant_charge_current = 0
BATT_EXIT_HYST=500      # every tier releases 0.5 C below its entry point

# --- frequency ceiling for each cpufreq policy ---
# Highest available OPP at or below the target is used.
# p0 = A520 (cpu0), p1/p3 = A720 (cpu1-4), p5 = X4 (cpu5).
CAP_T1_0=1800000
CAP_T1_1=2400000
CAP_T1_3=2400000
CAP_T1_5=2600000
CAP_T2_0=1500000
CAP_T2_1=2100000
CAP_T2_3=2100000
CAP_T2_5=2300000
CAP_T3_0=1300000
CAP_T3_1=1800000
CAP_T3_3=1800000
CAP_T3_5=2000000
CAP_T4_0=1100000
CAP_T4_1=1500000
CAP_T4_3=1500000
CAP_T4_5=1600000

# --- charge-current caps while charging (percent of the charger maximum) ---
CHG_PCT_1=50
CHG_PCT_2=25
CHG_PCT_3=10
CHG_PCT_4=2
CHG_WRITE_INTERVAL=10
