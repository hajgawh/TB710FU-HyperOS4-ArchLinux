# TB710FU: keep the capture PCM out of the playback pro-audio group.
# The pro-audio profile sets api.alsa.auto-link=true and node.group=pro-audio-0
# on both nodes, so starting playback also starts the unlinked capture PCM,
# reconfiguring the TDM speaker endpoint and the four AW882xx amps.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.platform-sound.pro-input-2" } ]
    actions = { update-props = { api.alsa.auto-link = false, node.group = "tb-mic" } }
  }
]
