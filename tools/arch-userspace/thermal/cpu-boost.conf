# TB710FU CPU boost configuration, read by tb-cpu-boost.service
#
# ENABLE=1 turns on the X4 hardware boost OPP (3302.4 MHz) at boot.
# ENABLE=0 keeps the normal EPSS ceiling (3052.8 MHz).  Boost only raises the
# maximum the governor may select; at idle the policy still drops to 480 MHz.
#
# The 3.3 GHz entry is real hardware, not a DT OPP-table cap: it appears in
# policy*/scaling_boost_frequencies and /sys/kernel/debug/opp/cpu*/opp:3302400000
# reports available=Y.  It is disabled by default because the mainline kernel
# has no Android thermal-engine policy; if sustained loads get too hot, set
# this to 0 and reboot (or run: tb-cpu-boost off).
ENABLE=1
