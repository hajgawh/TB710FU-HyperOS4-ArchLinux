# TB710FU: name the DP/HDMI PCM (MultiMedia2, pro-output-1) and keep it awake.
# The DISPLAY_PORT_RX_0 mixer route is enabled by tb-dp-audio.service at boot.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.pro-output-1" } ]
    actions = { update-props = { node.description = "TB710FU HDMI/DP", node.nick = "HDMI/DP", priority.session = 1800, priority.driver = 1800, session.suspend-timeout-seconds = 0, api.alsa.period-size = 1024, api.alsa.headroom = 1024 } }
  }
]
