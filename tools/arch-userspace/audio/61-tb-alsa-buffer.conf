# TB710FU: give the speaker PCM more slack than the default 3 x 960 samples
# (60 ms).  Two extra periods and a little headroom absorb scheduling jitter
# from Firefox/KWin bursts so the TDM port does not underrun and restart the
# DSP graph under the four AW882xx amps (audible as a click/stutter).
monitor.alsa.rules = [
    {
        matches = [
            { node.name = "alsa_output.platform-sound.pro-output-0" }
        ]
        actions = {
            update-props = {
                api.alsa.period-num = 5
                api.alsa.headroom = 1024
            }
        }
    }
]
